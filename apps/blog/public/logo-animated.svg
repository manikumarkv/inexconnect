<svg xmlns="http://www.w3.org/2000/svg" width="920" height="220" viewBox="0 0 920 220">
<style>
  .tile { animation: tileIn .45s ease-out both; transform-origin: 110px 110px; }
  @keyframes tileIn { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }
  .l1 { stroke-dasharray: 168.6; stroke-dashoffset: 168.6; animation: draw .8s ease-in-out .25s forwards; }
  .l2 { stroke-dasharray: 168.6; stroke-dashoffset: 168.6; animation: draw .8s ease-in-out .65s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .d1 { animation: pop .32s cubic-bezier(.2,1.6,.4,1) 1.35s both; transform-origin: 73px 122px; }
  .d2 { animation: pop .32s cubic-bezier(.2,1.6,.4,1) 1.5s both; transform-origin: 147px 98px; }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  .wm { animation: fadeUp .6s ease-out 1.5s both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .tg { animation: fadeIn .6s ease-out 1.95s both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
<rect class="tile" x="25" y="25" width="170" height="170" rx="30" fill="#232323"/>
<g fill="none" stroke-width="10">
  <rect class="l1" x="52" y="94" width="66" height="32" rx="16" stroke="#ffffff" transform="rotate(-45 85 110)"/>
  <rect class="l2" x="102" y="94" width="66" height="32" rx="16" stroke="#FF5C50" transform="rotate(-45 135 110)"/>
</g>
<circle class="d1" cx="73" cy="122" r="6.5" fill="#FF5C50"/>
<circle class="d2" cx="147" cy="98" r="6.5" fill="#ffffff"/>
<text class="wm" x="240" y="118" font-family="Arial, Helvetica, sans-serif" font-size="63" font-weight="bold"><tspan fill="#232323">iNex</tspan><tspan fill="#FF5C50">Connect</tspan></text>
<text class="tg" x="243" y="160" font-family="Arial, Helvetica, sans-serif" font-size="21" letter-spacing="6" fill="#6B7280">IDEA • BUILD • GROW</text>
</svg>
